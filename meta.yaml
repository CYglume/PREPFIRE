{% set name = "scenfire" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

channels:
  - conda-forge
  - defaults

source:
  path: .
  files:
    - scenfire/
    - setup.py
    - README.md
    - LICENSE
    - CHANGELOG.md

build:
  noarch: python
  script: python -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python>=3.10
    - pip
    - numpy>=1.26
    - pandas
    - geopandas
    - rasterio
    - xarray
    - netCDF4
    - cdsapi
    - scikit-learn
    - shapely
    - matplotlib
    - wheel
    - setuptools
    - pyproj
    - zarr
    - cftime
    - h5netcdf 
  run:
    - python>=3.10
    - pip
    - numpy>=1.26
    - pandas
    - geopandas
    - rasterio
    - xarray
    - netCDF4
    - cdsapi
    - scikit-learn
    - shapely
    - matplotlib
    - wheel
    - setuptools
    - pyproj
    - zarr
    - cftime
    - h5netcdf

# Simplified test section - only imports check
# test:
#   imports:
#     - scenfire
#     - scenfire.core
#     - scenfire.core.raster
#     - scenfire.core.weather
#     - scenfire.core.clustering
#     - scenfire.pipeline
#     - scenfire.utils

about:
  home: https://github.com/CYglume/SCENFIRE
  license: MIT
  summary: A Python package for fire simulation and analysis
  description: |
    SCENFIRE is a Python package for preparing materials for fire simulation and analysis, providing tools for processing fire data, 
    weather conditions, and landscape characteristics. The package implements a complete pipeline for fire risk assessment and simulation.
  dev_url: https://github.com/CYglume/SCENFIRE
  doc_url: https://github.com/CYglume/SCENFIRE#readme
  authors:
    - Cheng-Ying Yang
    - Marcos Rodrigues Mimbrero 